name: Deploy to GitHub Pages

on:
  # Manual only: this branch isn't the repo's default yet. Auto-deploying on
  # every push would silently overwrite whatever GitHub Pages is currently
  # serving from the default branch (Pages only ever serves one live site
  # per repo, regardless of which branch triggered the last deploy).
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the static site
        run: |
          set -e
          mkdir site
          cp -r index.html app.js styles.css supabaseClient.js vendor site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
