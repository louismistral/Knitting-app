name: Keep Supabase awake

# Supabase met en pause les projets du plan gratuit qui ne reçoivent pas assez
# de requêtes sur 7 jours. Quelques requêtes par jour suffisent à l'éviter.
# https://supabase.com/docs/guides/platform/free-project-pausing

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the REST API
        env:
          SUPABASE_URL: https://yvgefqeiawofngeatfci.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_sOKiFESHt3LZRLiI3rGOcg_Vlo_gh4N
        run: |
          set -euo pipefail
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            --retry 3 --retry-delay 5 --max-time 30 \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            "${SUPABASE_URL}/rest/v1/yarns?select=id&limit=1")
          echo "HTTP ${status}"
          # 200 et 401/403 (refus RLS) atteignent tous la base, donc comptent
          # comme activité. Seule une erreur réseau ou 5xx est un vrai échec.
          case "${status}" in
            2*|401|403) ;;
            *) exit 1 ;;
          esac
